<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <!-- corner filigree (pure SVG) -->
    <svg class="corner tl" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6 H34 Q34 20 20 22 Q10 23 10 34"/>
      <path d="M6 6 V34 Q20 34 22 20 Q23 10 34 10"/>
      <path d="M6 6 Q26 26 40 20"/><circle cx="6" cy="6" r="3" fill="currentColor" stroke="none"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6 H34 Q34 20 20 22 Q10 23 10 34"/>
      <path d="M6 6 V34 Q20 34 22 20 Q23 10 34 10"/>
      <path d="M6 6 Q26 26 40 20"/><circle cx="6" cy="6" r="3" fill="currentColor" stroke="none"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6 H34 Q34 20 20 22 Q10 23 10 34"/>
      <path d="M6 6 V34 Q20 34 22 20 Q23 10 34 10"/>
      <path d="M6 6 Q26 26 40 20"/><circle cx="6" cy="6" r="3" fill="currentColor" stroke="none"/>
    </svg>
    <svg class="corner br" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6 H34 Q34 20 20 22 Q10 23 10 34"/>
      <path d="M6 6 V34 Q20 34 22 20 Q23 10 34 10"/>
      <path d="M6 6 Q26 26 40 20"/><circle cx="6" cy="6" r="3" fill="currentColor" stroke="none"/>
    </svg>

    <h1 id="title">Spin the Wheel</h1>

    <!-- ornamental divider -->
    <svg class="divider" viewBox="0 0 200 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M18 8 H78"/><path d="M122 8 H182"/>
      <path d="M78 8 Q86 2 92 8 Q86 14 78 8" fill="currentColor" stroke="none"/>
      <path d="M122 8 Q114 2 108 8 Q114 14 122 8" fill="currentColor" stroke="none"/>
      <path d="M100 2 l6 6 -6 6 -6 -6 z" fill="currentColor" stroke="none"/>
    </svg>

    <div class="wheel-wrap" id="wrap">
      <!-- brass pointer -->
      <svg class="pointer" width="34" height="46" viewBox="0 0 34 46">
        <defs><linearGradient id="brassP" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e9c45a"/><stop offset="1" stop-color="#8a6510"/></linearGradient></defs>
        <path d="M17 45 L4 14 Q17 2 30 14 Z" fill="url(#brassP)" stroke="#5e4a12" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="17" cy="13" r="5" fill="#efe3c6" stroke="#5e4a12" stroke-width="1.5"/>
      </svg>

      <canvas id="wheel"></canvas>

      <!-- brass compass-rose medallion (center) -->
      <svg class="hub" viewBox="0 0 100 100">
        <defs><radialGradient id="brassH" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#f0d98a"/>
          <stop offset="55%" stop-color="#b8860b"/>
          <stop offset="100%" stop-color="#6e5312"/></radialGradient></defs>
        <circle cx="50" cy="50" r="47" fill="url(#brassH)" stroke="#4a3a0e" stroke-width="2"/>
        <circle cx="50" cy="50" r="37" fill="none" stroke="#4a3a0e" stroke-width="1" opacity=".7"/>
        <g fill="#efe3c6" stroke="#4a3a0e" stroke-width="1" stroke-linejoin="round">
          <path d="M50 10 L56 50 L50 90 L44 50 Z"/>
          <path d="M10 50 L50 44 L90 50 L50 56 Z"/>
          <path d="M22 22 L50 50 L46 28 Z" opacity=".9"/>
          <path d="M78 22 L50 50 L54 28 Z" opacity=".9"/>
          <path d="M22 78 L50 50 L46 72 Z" opacity=".9"/>
          <path d="M78 78 L50 50 L54 72 Z" opacity=".9"/>
        </g>
        <circle cx="50" cy="50" r="7" fill="#4a3a0e"/>
        <circle cx="50" cy="50" r="3" fill="#efe3c6"/>
      </svg>
    </div>

    <button id="spin">Spin</button>

    <div class="result" id="result">
      <svg class="fleur" viewBox="0 0 26 18" fill="currentColor"><path d="M2 9 Q10 2 13 9 Q10 16 2 9 Z M24 9 Q16 2 13 9 Q16 16 24 9 Z"/></svg>
      <span class="word" id="word"></span>
      <svg class="fleur" viewBox="0 0 26 18" fill="currentColor"><path d="M2 9 Q10 2 13 9 Q10 16 2 9 Z M24 9 Q16 2 13 9 Q16 16 24 9 Z"/></svg>
    </div>

    <div class="caption">Alter thy fate in <code>options.json</code></div>
  </div>

  <script src="wheel.js"></script>
</body>
</html>
